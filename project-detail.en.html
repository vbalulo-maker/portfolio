<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Details · Valeriy Balulo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <style>
        .detail-container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--bg-white);
            border-radius: var(--radius);
            padding: 40px 48px;
            box-shadow: var(--shadow);
        }
        .detail-container h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }
        .detail-container .meta {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }
        .detail-container .meta span { background: var(--bg-soft); padding: 2px 14px; border-radius: 20px; }
        .detail-container .description {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #333;
            margin: 20px 0 28px;
            border-left: 4px solid var(--accent);
            padding-left: 20px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px,1fr));
            gap: 16px;
            margin: 24px 0;
        }
        .metric-card {
            background: var(--bg-soft);
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            text-align: center;
        }
        .metric-card .value { font-size: 1.6rem; font-weight: 700; color: var(--accent); }
        .metric-card .label { font-size: 0.85rem; color: #555; margin-top: 4px; }
        .detail-container .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--text-primary);
            text-decoration: none;
            opacity: 0.7;
            transition: var(--transition);
        }
        .detail-container .back-link:hover { opacity: 1; }
        .strategy-block {
            background: var(--bg-soft);
            border-radius: 12px;
            padding: 20px 24px;
            margin: 16px 0;
            border-left: 4px solid var(--accent);
        }
        .strategy-block h3 { margin-bottom: 6px; }
        .strategy-block p { color: #555; }
        .presentation-frame {
            width: 100%;
            min-height: 600px;
            border: none;
            border-radius: var(--radius);
            margin-top: 16px;
        }
        @media (max-width:640px) {
            .detail-container { padding: 20px 16px; }
            .detail-container h1 { font-size: 1.8rem; }
        }
    </style>
    <script data-goatcounter="https://vbalulo.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<!-- ===== HEADER ===== -->
<header>
    <div class="container header-inner">
        <a href="index.en.html" class="logo">Valeriy <span>Balulo</span></a>
        <div class="header-right">
            <nav>
    <ul>
        <li><a href="index.en.html">Home</a></li>
        <li><a href="projects.en.html">Case Studies</a></li>
        <li><a href="ai-chat.en.html">Ask AI</a></li>
    </ul>
</nav>
            <div class="lang-switch">
                <span class="lang-inactive lang-ru">RU</span>
                <span class="lang-divider">/</span>
                <span class="lang-active lang-en">EN</span>
            </div>
        </div>
    </div>
</header>

<!-- ===== CONTENT ===== -->
<section class="section-hero" style="padding-top:20px;">
    <div class="container">
        <div class="detail-container" id="detailContainer">
            <a href="projects.en.html" class="back-link">← Back to Case Studies</a>
            <div id="detailContent">
                <!-- Загружается из JS -->
            </div>
        </div>
    </div>
</section>

<!-- ===== FOOTER ===== -->
<footer class="section-footer">
    <div class="container footer-inner">
        <div class="footer-copy">
            Hand-coded with good vibes. <a href="https://t.me/Balulo" style="color:var(--accent);text-decoration:none;"> Ask me how. </a>
            <br />
        </div>
    </div>
</footer>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const container = document.getElementById('detailContent');

        if (!id) {
            container.innerHTML = `
                <div style="text-align:center;padding:60px 20px;">
                    <span style="font-size:4rem;display:block;margin-bottom:16px;opacity:0.4;">🔍</span>
                    <h2 style="font-size:2rem;font-weight:600;margin-bottom:12px;">Case study not found</h2>
                    <p style="color:#666;max-width:400px;margin:0 auto 24px;">
                        The requested case study could not be found.
                    </p>
                    <a href="projects.en.html" style="color:var(--accent);text-decoration:none;font-weight:500;">← Back to Case Studies</a>
                </div>
            `;
            return;
        }

        fetch('data/projects.en.json')
            .then(r => r.json())
            .then(projects => {
                const project = projects.find(p => p.id === id);
                
                // Если проект не найден или нет полных деталей — показываем заглушку
                if (!project || project.hasFullDetails !== true) {
                    container.innerHTML = `
                        <div style="text-align:center;padding:60px 20px;">
                            <span style="font-size:4rem;display:block;margin-bottom:16px;opacity:0.4;">🚧</span>
                            <h2 style="font-size:2rem;font-weight:600;margin-bottom:12px;">${project ? 'Case study in progress' : 'Case study not found'}</h2>
                            <p style="color:#666;max-width:400px;margin:0 auto 24px;">
                                ${project ? 'I\'m preparing a detailed description of this project with metrics, insights, and visuals. In the meantime, feel free to explore other case studies.' : 'The requested case study was not found.'}
                            </p>
                            <a href="projects.en.html" style="color:var(--accent);text-decoration:none;font-weight:500;">← Back to Case Studies</a>
                        </div>
                    `;
                    return;
                }

                // ТИП: PRESENTATION — загружаем содержимое напрямую без iframe
if (project.type === 'presentation' && project.presentationFile) {
    // Загружаем HTML-файл презентации
    fetch(project.presentationFile)
        .then(response => {
            if (!response.ok) {
                throw new Error('Presentation not found');
            }
            return response.text();
        })
        .then(html => {
            // Вставляем HTML презентации в контейнер
            container.innerHTML = html;

            // --- НАСТРАИВАЕМ АВТОМАТИЧЕСКУЮ ПРОКРУТКУ С КНОПКАМИ ---
            const slides = container.querySelectorAll('.slide');
            if (slides.length > 0) {
                let currentIndex = 0;
                const totalSlides = slides.length;

                // Создаем контролы (кнопки и счетчик)
                const controls = document.createElement('div');
                controls.className = 'presentation-controls';
                controls.innerHTML = `
                    <button class="slide-btn slide-prev" aria-label="Previous slide">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" role="graphics-symbol" aria-hidden="true">
                            <path d="M7.825 11H19C19.2833 11 19.5208 11.0958 19.7125 11.2875C19.9042 11.4792 20 11.7167 20 12C20 12.2833 19.9042 12.5208 19.7125 12.7125C19.5208 12.9042 19.2833 13 19 13H7.825L12.725 17.9C12.925 18.1 13.0208 18.3333 13.0125 18.6C13.0042 18.8667 12.9 19.1 12.7 19.3C12.5 19.4833 12.2667 19.5792 12 19.5875C11.7333 19.5958 11.5 19.5 11.3 19.3L4.7 12.7C4.6 12.6 4.52917 12.4917 4.4875 12.375C4.44583 12.2583 4.425 12.1333 4.425 12C4.425 11.8667 4.44583 11.7417 4.4875 11.625C4.52917 11.5083 4.6 11.4 4.7 11.3L11.3 4.7C11.4833 4.51667 11.7125 4.425 11.9875 4.425C12.2625 4.425 12.5 4.51667 12.7 4.7C12.9 4.9 13 5.1375 13 5.4125C13 5.6875 12.9 5.925 12.7 6.125L7.825 11Z" fill="currentColor"/>
                        </svg>
                    </button>
                    <span class="slide-counter">${currentIndex + 1} / ${totalSlides}</span>
                    <button class="slide-btn slide-next" aria-label="Next slide">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" role="graphics-symbol" aria-hidden="true">
                            <path d="M16.175 13H5C4.71667 13 4.47917 12.9042 4.2875 12.7125C4.09583 12.5208 4 12.2833 4 12C4 11.7167 4.09583 11.4792 4.2875 11.2875C4.47917 11.0958 4.71667 11 5 11H16.175L11.275 6.09999C11.075 5.89999 10.9792 5.66665 10.9875 5.39999C10.9958 5.13332 11.1 4.89999 11.3 4.69999C11.5 4.51665 11.7333 4.42082 12 4.41249C12.2667 4.40415 12.5 4.49999 12.7 4.69999L19.3 11.3C19.4 11.4 19.4708 11.5083 19.5125 11.625C19.5542 11.7417 19.575 11.8667 19.575 12C19.575 12.1333 19.5542 12.2583 19.5125 12.375C19.4708 12.4917 19.4 12.6 19.3 12.7L12.7 19.3C12.5167 19.4833 12.2875 19.575 12.0125 19.575C11.7375 19.575 11.5 19.4833 11.3 19.3C11.1 19.1 11 18.8625 11 18.5875C11 18.3125 11.1 18.075 11.3 17.875L16.175 13Z" fill="currentColor"/>
                        </svg>
                    </button>
                `;

                // Добавляем контролы в контейнер
                container.appendChild(controls);

                // Функция показа слайда
                function showSlide(index) {
                    slides.forEach((slide, i) => {
                        slide.style.display = i === index ? 'flex' : 'none';
                    });
                    const counter = controls.querySelector('.slide-counter');
                    if (counter) {
                        counter.textContent = `${index + 1} / ${totalSlides}`;
                    }
                }

                // Показываем первый слайд
                showSlide(0);

                // Функции для кнопок
                const prevBtn = controls.querySelector('.slide-prev');
                const nextBtn = controls.querySelector('.slide-next');

                prevBtn.addEventListener('click', () => {
                    clearInterval(slideInterval);
                    const prev = (currentIndex - 1 + totalSlides) % totalSlides;
                    currentIndex = prev;
                    showSlide(currentIndex);
                });

                nextBtn.addEventListener('click', () => {
                    clearInterval(slideInterval);
                    const next = (currentIndex + 1) % totalSlides;
                    currentIndex = next;
                    showSlide(currentIndex);
                });

                // Автопрокрутка
                let slideInterval = setInterval(() => {
                    const next = (currentIndex + 1) % totalSlides;
                    currentIndex = next;
                    showSlide(currentIndex);
                }, 5000);

                // Останавливаем автопрокрутку при наведении
                const presentationContainer = container.querySelector('.slide')?.parentElement || container;
                presentationContainer.addEventListener('mouseenter', () => {
                    clearInterval(slideInterval);
                });
                presentationContainer.addEventListener('mouseleave', () => {
                    slideInterval = setInterval(() => {
                        const next = (currentIndex + 1) % totalSlides;
                        currentIndex = next;
                        showSlide(currentIndex);
                    }, 5000);
                });
            }
        })
        .catch(error => {
            console.error('Error loading presentation:', error);
            container.innerHTML = `
                <div style="text-align:center;padding:40px;">
                    <p style="color:#999;">Presentation not found.</p>
                    <a href="projects.en.html" style="color:var(--accent);">← Back to Case Studies</a>
                </div>
            `;
        });
    return;
}
                
                // Типы standard и strategy
                let html = `
                    <h1>${project.title}</h1>
                    <div class="meta">
                        <span>${project.company}</span>
                        <span>${project.role}</span>
                        <span>${project.year}</span>
                    </div>
                    <div class="description">${project.description || project.intro}</div>
                `;

                // Метрики
                if (project.metrics && Object.keys(project.metrics).length > 0) {
                    html += `<div class="metrics-grid">`;
                    for (const [key, val] of Object.entries(project.metrics)) {
                        html += `
                            <div class="metric-card">
                                <div class="value">${val}</div>
                                <div class="label">${key}</div>
                            </div>
                        `;
                    }
                    html += `</div>`;
                }

                // Стратегия (strategyBlocks)
                if (project.type === 'strategy' && project.strategyBlocks?.length) {
                    html += `<h2 style="margin-top:28px;font-size:1.6rem;">Strategy & Research</h2>`;
                    project.strategyBlocks.forEach(block => {
                        html += `
                            <div class="strategy-block">
                                <h3>${block.title || ''}</h3>
                                <p>${block.description || ''}</p>
                                ${block.image ? `<img src="${block.image}" alt="${block.title}" style="max-width:100%;border-radius:8px;margin-top:8px;" />` : ''}
                            </div>
                        `;
                    });
                }

                // Результаты (results)
                if (project.results?.length) {
                    html += `<h2 style="margin-top:28px;font-size:1.6rem;">Key Results</h2><ul style="list-style:none;padding:0;">`;
                    project.results.forEach(r => {
                        html += `<li style="padding:6px 0 6px 24px;background:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23C9A87C%22 stroke-width=%223%22><line x1=%224%22 y1=%2212%22 x2=%2220%22 y2=%2212%22/></svg>') left center no-repeat;background-size:16px;">${r}</li>`;
                    });
                    html += `</ul>`;
                }

                // Скриншоты (screenshots)
                if (project.screenshots?.length) {
                    html += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:20px;">`;
                    project.screenshots.forEach(s => {
                        html += `<img src="${s}" alt="Screenshot" style="width:100%;border-radius:8px;border:1px solid var(--border-light);" />`;
                    });
                    html += `</div>`;
                }

                container.innerHTML = html;
            })
            .catch(() => {
                container.innerHTML = `
                    <div style="text-align:center;padding:60px 20px;">
                        <span style="font-size:4rem;display:block;margin-bottom:16px;opacity:0.4;">⚠️</span>
                        <h2 style="font-size:2rem;font-weight:600;margin-bottom:12px;">Could not load data</h2>
                        <p style="color:#666;max-width:400px;margin:0 auto 24px;">
                            Please try again later.
                        </p>
                        <a href="projects.en.html" style="color:var(--accent);text-decoration:none;font-weight:500;">← Back to Case Studies</a>
                    </div>
                `;
            });
    });
</script>
</body>
</html>
